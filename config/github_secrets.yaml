---
# GitHub Actions secrets managed by playbooks/setup/github_secrets.yaml
# Run: ./run github secrets            (all repos)
#      ./run github secrets -e repo=julianh2o/partyfoal

# Named groups of secrets: GITHUB_SECRET_NAME -> variable holding the value.
# Variables come from secrets.yml (vault), or the playbook's derived vars
# (ansible_ssh_private_key is read from secrets/id_ed25519).
github_secret_groups:
  # Needed by .github/workflows/docker-deploy.yml callers
  docker_deploy:
    DOCKERHUB_USERNAME: dockerhub_username
    DOCKERHUB_TOKEN: dockerhub_token
    TS_OAUTH_CLIENT_ID: tailscale_ci_oauth_client_id
    TS_OAUTH_SECRET: tailscale_ci_oauth_secret
    DEPLOY_SSH_KEY: ansible_ssh_private_key

# Repo -> list of groups to push
github_secret_repos:
  julianh2o/partyfoal:
    - docker_deploy
  julianh2o/bawdy-esp32:
    - docker_deploy
  julianh2o/bluebell:
    - docker_deploy
