# Reusable workflow: build a Docker image, push it to Docker Hub as :latest (+ :sha-<short>),
# then SSH into the target host over Tailscale and restart its compose stack.
#
# The compose file on the host is owned by this repo (templates/<service>-compose.yml.j2,
# deployed by the docker_service role); this workflow only refreshes the image.
#
# Usage from an app repo (.github/workflows/deploy.yml):
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   jobs:
#     deploy:
#       uses: julianh2o/fairgrounds-infra/.github/workflows/docker-deploy.yml@main
#       with:
#         image: julianh2o/myapp
#         host: 10.10.0.11
#         stack_path: /opt/myapp
#       secrets: inherit
#
# Secrets required in the calling repo:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   Docker Hub login (token needs read/write)
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET   Tailscale OAuth client (tag:ci)
#   DEPLOY_SSH_KEY                        Private key for ssh_user on the host

name: Docker Build & Deploy

on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub repository, e.g. julianh2o/partyfoal
        required: true
        type: string
      host:
        description: Host (Tailscale-reachable) running the compose stack
        required: true
        type: string
      stack_path:
        description: Directory on the host containing docker-compose.yml
        required: true
        type: string
      ssh_user:
        description: SSH user on the host
        required: false
        type: string
        default: ansible
      sudo:
        description: Run docker commands with sudo on the host
        required: false
        type: boolean
        default: true
      context:
        description: Docker build context
        required: false
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms for the image
        required: false
        type: string
        default: linux/amd64
      deploy:
        description: Restart the stack on the host after pushing
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      DEPLOY_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build & push ${{ inputs.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.host }}:${{ inputs.stack_path }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.deploy }}
    # Never run two restarts of the same stack at once
    concurrency:
      group: docker-deploy-${{ inputs.host }}-${{ inputs.stack_path }}
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull and restart stack
        env:
          HOST: ${{ inputs.host }}
          SSH_USER: ${{ inputs.ssh_user }}
          STACK_PATH: ${{ inputs.stack_path }}
          USE_SUDO: ${{ inputs.sudo }}
        run: |
          # Pull before down so the stack is only offline for the restart itself
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$SSH_USER@$HOST" bash -s -- "$(printf %q "$STACK_PATH")" "$USE_SUDO" <<'EOF'
          set -euo pipefail
          cd "$1"
          if [ "$2" = true ]; then DOCKER="sudo docker"; else DOCKER=docker; fi
          $DOCKER compose pull
          $DOCKER compose down
          $DOCKER compose up -d
          $DOCKER compose ps
          $DOCKER image prune -f
          EOF
