---
- name: Configure fstab mounts
  hosts: vms
  become: yes
  vars_files:
    - ../../secrets.yml

  vars:
    smb_server: "10.10.0.6"
    credentials_file: "/mnt/smbcredentials"
    stop_containers: false
    # At boot, Docker waits this long for the NAS (e.g. when a power blip restarts it with the VMs)
    nas_wait_seconds: 300

    # Common performance options for all CIFS mounts
    common_cifs_opts: "vers=3.1.1,actimeo=30,rsize=4194304,wsize=4194304,file_mode=0777,dir_mode=0777"

    mounts:
      - name: Media
        src: "//{{ smb_server }}/Media"
        path: /mnt/Media
        opts: "nobrl,credentials={{ credentials_file }},uid=root,gid=root,{{ common_cifs_opts }}"

      - name: Store
        src: "//{{ smb_server }}/Store"
        path: /mnt/Store
        opts: "credentials={{ credentials_file }},uid=root,gid=root,{{ common_cifs_opts }}"

      - name: Photos
        src: "//{{ smb_server }}/Photos"
        path: /mnt/Photos
        opts: "credentials={{ credentials_file }},uid=root,gid=root,{{ common_cifs_opts }}"
        
      - name: Podbase
        src: "//{{ smb_server }}/Podbase"
        path: /mnt/Podbase
        opts: "credentials={{ credentials_file }},uid=root,gid=root,{{ common_cifs_opts }}"

      - name: EricBackup
        src: "//{{ smb_server }}/EricBackup"
        path: /mnt/EricBackup
        opts: "credentials={{ credentials_file }},uid=eric,gid=eric,{{ common_cifs_opts }}"
        retry: false  # never mounts (there's no eric user), so nas-mounts skips it

  tasks:
    - name: Ensure cifs-utils is installed
      ansible.builtin.package:
        name: cifs-utils
        state: present

    - name: Deploy SMB credentials file
      ansible.builtin.template:
        src: "{{ inventory_dir }}/templates/smbcredentials.j2"
        dest: "{{ credentials_file }}"
        owner: root
        group: root
        mode: "0600"

    # Stop containers and remount block
    - name: Stop all Docker containers
      ansible.builtin.shell:
        cmd: docker stop $(docker ps -q) 2>/dev/null || true
      when: stop_containers | bool

    - name: Unmount all filesystems under /mnt
      ansible.builtin.shell:
        cmd: umount /mnt/* 2>/dev/null || true
      when: stop_containers | bool

    - name: Unlock mount point directories
      ansible.builtin.shell:
        cmd: "mountpoint -q {{ item.path }} || chattr -i {{ item.path }} 2>/dev/null || true"
      loop: "{{ mounts }}"
      when: stop_containers | bool

    - name: Remove mount point directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ mounts }}"
      when: stop_containers | bool

    - name: Create mount point directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "0755"
      loop: "{{ mounts }}"

    - name: Configure fstab entries for CIFS mounts
      ansible.posix.mount:
        src: "{{ item.src }}"
        path: "{{ item.path }}"
        fstype: cifs
        opts: "{{ item.opts }}"
        dump: "0"
        passno: "0"
        state: present
      loop: "{{ mounts }}"

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Mount all filesystems
      ansible.builtin.command:
        cmd: mount -a
      changed_when: false
      failed_when: false

    - name: Install the nas-mounts script
      ansible.builtin.template:
        src: "{{ inventory_dir }}/templates/nas-mounts.sh.j2"
        dest: /usr/local/sbin/nas-mounts
        owner: root
        group: root
        mode: "0755"

    - name: Install the nas-mounts units
      ansible.builtin.template:
        src: "{{ inventory_dir }}/templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - nas-mounts-wait.service
        - nas-mounts-retry.service
        - nas-mounts-retry.timer

    - name: Enable nas-mounts (Docker waits for the NAS at boot, a timer remounts anything missing)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        daemon_reload: yes
      loop:
        - nas-mounts-wait.service
        - nas-mounts-retry.timer

    - name: Start the nas-mounts retry timer
      ansible.builtin.systemd:
        name: nas-mounts-retry.timer
        state: started

    - name: Start all Docker containers
      ansible.builtin.shell:
        cmd: docker start $(docker ps -aq) 2>/dev/null || true
      when: stop_containers | bool

    - name: Verify mounts are active
      ansible.builtin.command:
        cmd: "mountpoint -q {{ item.path }}"
      loop: "{{ mounts }}"
      register: mount_check
      changed_when: false
      failed_when: false

    - name: Display mount status
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ 'MOUNTED' if item.rc == 0 else 'NOT MOUNTED' }}"
      loop: "{{ mount_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
