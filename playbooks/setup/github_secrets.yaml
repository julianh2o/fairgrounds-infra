---
# Push GitHub Actions secrets from the vault to repos listed in config/github_secrets.yaml.
# Runs locally and uses your `gh` CLI login (needs repo admin, or GH_TOKEN with secrets:write).
# Optional: -e repo=owner/name to only update one repo.
- name: Sync GitHub Actions secrets
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - ../../secrets.yml
    - ../../config/github_secrets.yaml

  vars:
    ansible_ssh_private_key: "{{ lookup('file', playbook_dir ~ '/../../secrets/id_ed25519') }}"
    repo: ""
    github_secrets_flat: >-
      {%- set out = [] -%}
      {%- for r, groups in github_secret_repos.items() if not repo or r == repo -%}
      {%- for group in groups -%}
      {%- for name, var in github_secret_groups[group].items() -%}
      {%- set _ = out.append({'repo': r, 'name': name, 'var': var}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

  tasks:
    - name: Check there is something to sync
      ansible.builtin.assert:
        that: github_secrets_flat | length > 0
        fail_msg: "No secrets matched{{ ' repo ' ~ repo if repo else '' }} in config/github_secrets.yaml"
        quiet: yes

    - name: Check all values exist in the vault
      ansible.builtin.assert:
        that: missing | length == 0
        fail_msg: "Missing from secrets.yml: {{ missing | join(', ') }} (add with ./run secret new <key> <value>)"
        quiet: yes
      vars:
        missing: "{{ github_secrets_flat | map(attribute='var') | unique | reject('in', query('varnames', '.+')) | list }}"

    - name: Check gh CLI is authenticated
      ansible.builtin.command: gh auth status
      changed_when: false

    - name: Secrets to be set
      ansible.builtin.debug:
        msg: "{{ github_secrets_flat | map(attribute='repo') | zip(github_secrets_flat | map(attribute='name')) | map('join', ': ') | list }}"

    # Values go over stdin so they never appear in argv; no_log keeps them out of output
    - name: Set GitHub Actions secrets
      ansible.builtin.command:
        argv: [gh, secret, set, "{{ item.name }}", --repo, "{{ item.repo }}"]
        stdin: "{{ lookup('vars', item.var) }}"
        stdin_add_newline: false
      loop: "{{ github_secrets_flat }}"
      no_log: true
