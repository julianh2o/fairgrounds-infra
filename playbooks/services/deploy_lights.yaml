---
- name: Deploy Lights
  hosts: ceto
  become: yes

  roles:
    - role: docker_service
      vars:
        service_name: lights
        compose_template: lights-compose.yml.j2
        service_directories:
          # lightd runs as uid 10001 and writes controllers.json, patterns/ and lightd-state.json here
          - path: config
            mode: "0777"
          - path: sequences
            mode: "0777"
        docker_compose_state: present
