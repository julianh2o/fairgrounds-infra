---
# Strata (github.com/Niko1221/Strata) serving Qwen3.8-Flash-Next on kvasir's WSL as a
# systemd service, no Docker. The engine is compiled from a pinned git tag: to update,
# bump strata_version and deploy. Strata's own self-updater is never run.
# Needs kvasir's .wslconfig memory=104GB (UD-Q4_K_XL keeps ~77 GB of experts in RAM;
# 128 GB installed) and strata_api_key in secrets.yml. First deploy downloads ~111 GB
# and compiles (~1 h). strata_enabled: false stops and disables the service (install
# and model kept) and skips the build; set to true to bring it back. The model holds
# ~88 GB of RAM while running, so keep it off unless it is actually in use.
# Back to Q2_0: strata_family qwen, strata_model Q2_0, strata_tag Q2_0, strata_min_ram_gb 44.
- name: Deploy Strata
  hosts: kvasir
  become: yes

  vars_files:
    - ../../secrets.yml

  vars:
    strata_enabled: false
    strata_version: v0.2.7.1
    # Unsloth's 4-bit file: 93.1% top-1 agreement with Q8_0 (Q2_0: 80.6%)
    strata_family: unsloth
    strata_model: UD-Q4_K_XL
    # setup names the model dir, config and pack "<family tag><model>" (the qwen family's tag is empty)
    strata_tag: unsloth-UD-Q4_K_XL
    # every expert in RAM plus setup's 16 GB to spare; below this setup reads experts from the SSD
    strata_min_ram_gb: 92
    # 192K of the model's trained 262K. INT8 KV is ~20 KiB/token (~3.75 GiB at 192K), taken
    # out of the auto-sized GPU expert cache rather than spilling to RAM.
    strata_context: 196608
    # keep this much VRAM free after the expert cache fills the card: below ~512 MiB the
    # driver can page GPU memory to system RAM and decode collapses (engine warns, #2065).
    # The verify windows are allocated after the reserve is applied, so 832 still left
    # ~330 MiB free; 1280 clears the 512 MiB line with margin.
    strata_vram_reserve_mib: 1280
    strata_port: 8080
    strata_root: /opt/strata
    strata_src: /opt/strata/src
    strata_data: /opt/strata/data
    strata_config: "/opt/strata/src/strata-{{ strata_tag | lower }}.json"
    # setup applies the refusal projection only to the qwen/coder families ("not tested with
    # UD-Q4_K_XL: left off"), so for other families the same engine flags are added to the run
    # config by hand. Setup carries hand-added args over on later runs (user_args).
    strata_cvec_args:
      - --control-vector-scaled
      - "{{ strata_src }}/data/experimental-speed-projection/Qwen3.8-Flash-Next-experimental-speed-projection.gguf:1.0"
      - --control-vector-layer-range
      - "4"
      - "44"
      - --cvec-mode
      - project
      - --cvec-dir
      - per-layer
    strata_path: /usr/local/cuda-13.0/bin:/usr/lib/wsl/lib:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    # --experimental-speed-projection on: Strata's bundled refusal-direction vector
    # (abliteration at run time); a request can turn it off with
    # "experimental_speed_projection": false
    strata_setup_args: >-
      --family {{ strata_family }} --model {{ strata_model }} --context {{ strata_context }}
      --vision cpu --data-dir {{ strata_data }} --build --cuda 13 --no-browser --no-start --yes
      --experimental-speed-projection on --vram-reserve-mib {{ strata_vram_reserve_mib }}
    strata_setup_stamp: /opt/strata/setup-args

  tasks:
    - name: Check for the strata unit
      stat:
        path: /etc/systemd/system/strata.service
      register: strata_unit
      when: not (strata_enabled | bool)

    - name: Stop and disable strata (strata_enabled is false)
      systemd:
        name: strata
        state: stopped
        enabled: no
      when: not (strata_enabled | bool) and strata_unit.stat.exists

    - name: Done, strata is disabled
      meta: end_play
      when: not (strata_enabled | bool)

    # memory facts come back empty on the WSL kernel, so read meminfo directly
    - name: Read WSL memory
      command: awk '/^MemTotal/ {print int($2 / 1024)}' /proc/meminfo
      register: strata_mem
      changed_when: false
      check_mode: no

    - name: Check WSL has enough RAM for the experts
      assert:
        that: strata_mem.stdout | int >= strata_min_ram_gb * 1000
        fail_msg: >-
          WSL sees {{ ((strata_mem.stdout | int) / 1024) | round(1) }} GB. Raise memory= under [wsl2] in
          C:\Users\Julian\.wslconfig (104GB for UD-Q4_K_XL), then run wsl --shutdown.

    - name: Install build dependencies
      apt:
        name: [build-essential, git, curl, python3-venv, python3-pip, acl]
        state: present
        update_cache: yes
        cache_valid_time: 86400

    - name: Install NVIDIA's WSL CUDA repository key
      apt:
        deb: https://developer.download.nvidia.com/compute/cuda/repos/wsl-ubuntu/x86_64/cuda-keyring_1.1-1_all.deb
        state: present

    - name: Install the CUDA 13.0 toolkit (toolkit only, WSL uses the Windows driver)
      apt:
        name: cuda-toolkit-13-0
        state: present
        update_cache: yes

    - name: Create the strata user
      user:
        name: strata
        system: yes
        home: "{{ strata_root }}"
        create_home: no
        shell: /usr/sbin/nologin

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: strata
        group: strata
        mode: "0755"
      loop:
        - "{{ strata_root }}"
        - "{{ strata_data }}"

    - name: Check out Strata {{ strata_version }}
      become_user: strata
      git:
        repo: https://github.com/Niko1221/Strata.git
        dest: "{{ strata_src }}"
        version: "{{ strata_version }}"
        force: yes
      register: strata_git

    - name: Check for an existing install
      stat:
        path: "{{ strata_config }}"
      register: strata_installed

    # setup only runs on a first install, so changed setup args would otherwise never apply
    - name: Read the setup args the install was made with
      command: cat {{ strata_setup_stamp }}
      register: strata_stamp
      changed_when: false
      failed_when: false
      check_mode: no

    # setup sizes the RAM-resident experts from free RAM, so a running engine (another
    # model's ~34-77 GB) must not be holding it while setup measures
    - name: Stop strata before setup re-runs
      systemd:
        name: strata
        state: stopped
      failed_when: false
      when: not strata_installed.stat.exists or (strata_stamp.stdout | trim) != (strata_setup_args | trim)

    - name: Install Strata, build the engine, download the model (or apply new setup args)
      become_user: strata
      command: "./setup.sh {{ strata_setup_args }}"
      args:
        chdir: "{{ strata_src }}"
      environment:
        PATH: "{{ strata_path }}"
        HOME: "{{ strata_root }}"
      async: 14400
      poll: 30
      when: not strata_installed.stat.exists or (strata_stamp.stdout | trim) != (strata_setup_args | trim)
      notify: Restart strata

    - name: Update Strata to the new version (engine rebuild, model files kept)
      become_user: strata
      command: "./setup.sh --update {{ strata_setup_args }}"
      args:
        chdir: "{{ strata_src }}"
      environment:
        PATH: "{{ strata_path }}"
        HOME: "{{ strata_root }}"
      async: 7200
      poll: 30
      when: strata_installed.stat.exists and strata_git.changed
      notify: Restart strata

    - name: Check that setup wrote the run config
      stat:
        path: "{{ strata_config }}"
      register: strata_config_stat
      failed_when: not strata_config_stat.stat.exists

    - name: Add the refusal projection to the run config (setup leaves it off outside qwen/coder)
      become_user: strata
      command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            path, extra = sys.argv[1], json.loads(sys.argv[2])
            cfg = json.load(open(path))
            if "--control-vector-scaled" in cfg["args"]:
                print("present"); sys.exit(0)
            cfg["args"] += extra
            json.dump(cfg, open(path, "w"), indent=4)
            print("added")
          - "{{ strata_config }}"
          - "{{ strata_cvec_args | to_json }}"
      register: strata_cvec
      changed_when: "'added' in strata_cvec.stdout"
      when: strata_family not in ['qwen', 'coder']
      notify: Restart strata

    - name: Remember the setup args
      copy:
        dest: "{{ strata_setup_stamp }}"
        content: "{{ strata_setup_args | trim }}"
        owner: strata
        group: strata
        mode: "0644"

    - name: Write the API key environment file
      copy:
        dest: /etc/strata.env
        content: "STRATA_API_KEY={{ strata_api_key }}\n"
        owner: root
        group: root
        mode: "0600"
      notify: Restart strata

    - name: Install the systemd unit
      template:
        src: ../../templates/strata.service.j2
        dest: /etc/systemd/system/strata.service
        mode: "0644"
      notify: Restart strata

    - name: Enable and start strata
      systemd:
        name: strata
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Apply pending restarts
      meta: flush_handlers

    - name: Wait for the model to load
      uri:
        url: "http://127.0.0.1:{{ strata_port }}/health"
      register: strata_health
      until: strata_health.status == 200
      retries: 90
      delay: 10

  handlers:
    - name: Restart strata
      systemd:
        name: strata
        state: restarted
        daemon_reload: yes
