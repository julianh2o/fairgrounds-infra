---
- name: Deploy Partyfoal
  hosts: metis
  become: yes

  vars:
    partyfoal_app_base_url: "https://partyfoal.bawdyshop.space"
    partyfoal_email_from: "Partyfoal <onboarding@resend.dev>"

  vars_files:
    - ../../secrets.yml

  roles:
    - role: docker_service
      vars:
        service_name: partyfoal
        compose_template: partyfoal-compose.yml.j2
        docker_compose_state: present
