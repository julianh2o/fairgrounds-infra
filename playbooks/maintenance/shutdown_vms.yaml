---
# Gracefully shut down all Proxmox VMs (e.g. before njord maintenance or a power outage).
# Run with: ./run maintenance shutdown-vms
# Skip the confirmation prompt: ./run maintenance shutdown-vms -e confirm=yes
# Order: workers first, then europa (DNS/pihole), then arethusa last (it's the Ansible controller).
# Containers get stopped with a 60s grace period before each guest powers off.

- name: Confirm shutdown
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Ask for confirmation
      ansible.builtin.pause:
        prompt: "This powers off ALL VMs ({{ groups['vms'] | join(', ') }}). Type 'yes' to continue"
      register: confirm_prompt
      when: confirm | default('') != 'yes'

    - name: Abort unless confirmed
      ansible.builtin.fail:
        msg: "Aborted, nothing was shut down."
      when: confirm | default('') != 'yes' and confirm_prompt.user_input | default('') != 'yes'

- name: Shut down worker VMs
  hosts: vms:!europa:!arethusa
  become: yes
  gather_facts: no
  tasks: &shutdown_tasks
    - name: Stop running containers gracefully
      ansible.builtin.shell: |
        ids=$(docker ps -q)
        [ -z "$ids" ] || docker stop -t 60 $ids
      changed_when: true

    - name: Power off
      ansible.builtin.shell: sleep 2 && systemctl poweroff
      async: 30
      poll: 0

    - name: Wait for SSH to go away
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: stopped
        timeout: 300
      delegate_to: localhost
      become: no
      when: inventory_hostname != 'arethusa'

- name: Shut down europa (DNS)
  hosts: europa
  become: yes
  gather_facts: no
  tasks: *shutdown_tasks

- name: Shut down arethusa (controller, last)
  hosts: arethusa
  become: yes
  gather_facts: no
  tasks: *shutdown_tasks
